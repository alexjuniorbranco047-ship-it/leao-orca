<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leão Orça</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f7b900">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Leão Orça">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🦁%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#ffffff;--card:#fffbea;--tx:#241d05;--mu:#7a6f4a;--pr:#f7b900;--pt:#8a5f00;--on:#2a2000;--ln:#f1e6b8;--ok:#1f9d5c;--wa:#e07a1f;--bl:#2c78c9;--rd:#d4493e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14110a;--card:#211c0f;--tx:#fff8e0;--mu:#b5a878;--pr:#ffc933;--pt:#ffc933;--on:#1a1400;--ln:#3a3218}}
:root[data-theme="dark"]{--bg:#14110a;--card:#211c0f;--tx:#fff8e0;--mu:#b5a878;--pr:#ffc933;--pt:#ffc933;--on:#1a1400;--ln:#3a3218}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 "Bricolage Grotesque",system-ui,sans-serif;padding-bottom:150px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:14px 18px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:22px;font-weight:800;margin:0;flex:1;letter-spacing:-.4px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--pr);display:grid;place-items:center;font-size:19px}
.logo{overflow:hidden}.logo img{width:100%;height:100%;object-fit:contain}
main{padding:0 18px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:14px;margin-bottom:10px}
.big{background:var(--pr);color:var(--on);border:0}
.big small{color:var(--on);opacity:1;font-weight:700;font-size:15px}.big b{display:block;font-size:30px;font-weight:800;letter-spacing:-1px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{text-align:left;font:inherit;color:inherit;cursor:pointer}
.tile b{display:block;font-size:26px;font-weight:800}
small,.mu{color:var(--mu);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row+.row{margin-top:6px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
input,select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:11px 12px;margin:4px 0 8px}
label{font-size:13px;color:var(--mu);font-weight:600}
button{font:inherit;cursor:pointer}
.btn{background:var(--pr);color:var(--on);border:0;border-radius:12px;padding:13px 16px;font-weight:600;width:100%}
.ghost{background:transparent;color:var(--pt);border:1px solid var(--ln)}
.danger{color:var(--rd)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{flex:none;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:20px;padding:7px 13px;font-size:14px}
.chip.on{background:var(--pr);color:var(--on);border-color:var(--pr)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ln);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:8px 0;font-size:11px;font-weight:600}
nav button.on{color:var(--pt)}nav span{display:block;font-size:20px}
nav .cal{display:flex;flex-direction:column;width:26px;height:24px;margin:0 auto 2px;border:2px solid currentColor;border-radius:6px;overflow:hidden;font-size:9px;text-align:center}nav .cal i{background:currentColor;font-style:normal;font-size:7px;line-height:8px;font-weight:800}nav .cal i em{color:var(--card);font-style:normal}nav .cal b{font-size:13px;line-height:14px;font-weight:800}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);border:0;border-radius:16px;padding:14px 18px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:6}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end}
.sheet>div{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{height:14px;border-radius:7px;background:var(--ln);overflow:hidden}.bar i{display:block;height:100%;border-radius:7px}
.it{display:grid;grid-template-columns:1fr 78px 48px 38px;gap:6px;align-items:start}.it .chip{margin-top:4px;padding:9px 0}
.empty{text-align:center;padding:30px 10px;color:var(--mu)}
#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:auto}
</style></head>
<body>
<header><div class="logo">🦁</div><h1 id="ttl">Leão Orça<small style="display:block;font-weight:400">Orçamentos sem complicação</small></h1><span id="nv" title="Nuvem">📴</span></header>
<main id="app"></main>
<button class="fab" onclick="novo()">+ Novo orçamento</button>
<nav id="nav"></nav>
<div id="sh"></div>
<div id="login"><div style="width:100%;max-width:360px;padding:24px;text-align:center">
<div class="logo" style="width:64px;height:64px;font-size:34px;margin:0 auto 12px">🦁</div>
<h1 style="margin:0 0 4px;font-size:28px;font-weight:800">Leão Orça</h1>
<p class="mu" style="margin:0 0 18px">Orçamentos sem complicação</p>
<div id="lc" class="mu">Carregando…</div>
<div id="lf" style="display:none;text-align:left">
<label>E-mail</label><input id="le" type="email" autocomplete="email" inputmode="email">
<label>Senha</label><input id="ls" type="password" autocomplete="current-password">
<label style="display:flex;gap:8px;align-items:flex-start;font-weight:400;margin:6px 0 4px"><input id="lt" type="checkbox" style="width:auto;margin:3px 0 0"><span>Li e aceito os <a href="legal.html#termos" target="_blank" rel="noopener" style="color:var(--pt)">Termos de Uso</a> e a <a href="legal.html#privacidade" target="_blank" rel="noopener" style="color:var(--pt)">Política de Privacidade</a> (necessário para criar a conta).</span></label>
<p id="lm" style="color:var(--rd);min-height:20px;margin:0 0 8px;font-size:14px"></p>
<button class="btn" onclick="entrar()">Entrar</button>
<button class="btn ghost" style="margin-top:8px" onclick="criar()">Criar conta</button>
<p style="text-align:center;margin-bottom:0"><button class="chip" style="border:0;background:none;color:var(--pt)" onclick="esqueci()">Esqueci a senha</button> <a href="legal.html#suporte" target="_blank" rel="noopener" style="color:var(--pt);font-size:14px;margin-left:8px">Suporte</a></p>
</div></div></div>
<script>
const ST=["Pendente","Aprovado","Em andamento","Concluído"];
const COR={"Pendente":"var(--wa)","Aprovado":"#8b5cf6","Em andamento":"var(--bl)","Concluído":"var(--ok)"};
const brl=n=>n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tot=o=>Math.max(0,o.itens.reduce((s,i)=>s+i.p*i.q,0)*(1-(o.desc||0)/100));
const pago=o=>o.pags?o.pags.reduce((s,p)=>s+p.v,0):(o.status=="Concluído"?tot(o):0);
const falta=o=>Math.max(0,Math.round((tot(o)-pago(o))*100)/100);
const p2=n=>String(n).padStart(2,"0");
const d=(n)=>{const x=new Date();x.setDate(x.getDate()-n);return x.getFullYear()+"-"+p2(x.getMonth()+1)+"-"+p2(x.getDate())};
const dt=s=>s.split("-").reverse().join("/");
let DB={clientes:[{id:1,nome:"Marina Duarte",tel:"(11) 98888-1111"},{id:2,nome:"Carlos Ribeiro",tel:"(21) 97777-2222"}],
pedidos:[{id:1,cliente:"Marina Duarte",status:"Concluído",data:d(9),desc:0,itens:[{d:"Instalação de ar-condicionado",p:850,q:2}]},
{id:2,cliente:"Carlos Ribeiro",status:"Pendente",data:d(2),desc:10,itens:[{d:"Análise de consumo",p:500,q:1},{d:"Automação residencial",p:5000,q:1}]},
{id:3,cliente:"Marina Duarte",status:"Em andamento",data:d(4),desc:0,itens:[{d:"Manutenção preventiva",p:320,q:3}]}],seq:4};
try{const s=JSON.parse(localStorage.getItem("leao-orca"));if(s&&s.pedidos)DB=s}catch(e){}
DB.catalogo=DB.catalogo||[];DB.agenda=DB.agenda||[];migra();
let CL=null,nt=0;
const save=()=>{DB.t=Date.now();try{localStorage.setItem("leao-orca",JSON.stringify(DB))}catch(e){}push()};
let EMP={nome:"",doc:"",tel:"",email:"",end:"",val:7,logo:null};
try{const s=JSON.parse(localStorage.getItem("leao-orca-emp"));if(s)EMP={...EMP,...s}}catch(e){}
let tab="inicio",filtro="Todos",busca="";
let ftag="Todos",bcli="",fag="Próximos";
const CAG={"Hoje":"var(--bl)","Atrasados":"var(--rd)","Concluídos":"var(--ok)"};
aplicaTema();
const TABS=[["inicio","🏠","Início"],["pedidos","📋","Orçamentos"],["clientes","👥","Clientes"],["agenda","CAL","Agenda"],["mais","☰","Mais"]];
const num=o=>String(o.id).padStart(3,"0")+"-"+o.data.slice(0,4);

function render(){document.querySelector(".fab").style.display=(tab=="inicio"||tab=="pedidos")?"":"none";
  const L=document.querySelector(".logo");if(L)L.innerHTML=EMP.logo?`<img src="${EMP.logo.u}" alt="">`:"🦁";
  document.getElementById("nav").innerHTML=TABS.map(t=>{const on=tab==t[0]||(t[0]=="mais"&&(tab=="catalogo"||tab=="gestao"));return `<button class="${on?"on":""}" onclick="${t[0]=="mais"?"maisMenu()":`tab='${t[0]}';render();scrollTo(0,0)`}">${t[1]=="CAL"?calIcon():`<span>${t[1]}</span>`}${t[2]}</button>`}).join("");
  document.getElementById("app").innerHTML=V[tab]();
}
const pill=o=>`<span class="dot" style="background:${COR[o.status]}"></span><small>${o.status}</small>`;
const lista=ps=>ps.length?ps.map(o=>`<div class="card tile" onclick="det(${o.id})"><div>${pill(o)}</div><div class="row"><div><b>${esc(o.cliente)}</b><br><small>Nº ${num(o)} · ${dt(o.data)}</small></div><b>${brl(tot(o))}</b></div></div>`).join(""):`<div class="empty">Nenhum orçamento aqui ainda.<br>Toque em “Novo orçamento” para criar o primeiro.</div>`;
const V={
inicio(){
  const ab=DB.pedidos.filter(o=>o.status!="Concluído");
  const rec=DB.pedidos.filter(o=>["Aprovado","Em andamento","Concluído"].includes(o.status)).reduce((s,o)=>s+falta(o),0);
  return `<div class="card big"><small>A receber</small><b>${brl(rec)}</b><small>${ab.length} orçamento(s) em aberto</small></div>
  <div class="grid"><button class="card tile" onclick="tab='pedidos';filtro='Pendente';render()"><small><span class="dot" style="background:var(--wa)"></span>Pendentes</small><b>${DB.pedidos.filter(o=>o.status=="Pendente").length}</b></button>
  <button class="card tile" onclick="tab='pedidos';filtro='Em andamento';render()"><small><span class="dot" style="background:var(--bl)"></span>Em andamento</small><b>${DB.pedidos.filter(o=>o.status=="Em andamento").length}</b></button>
  <button class="card tile" onclick="tab='clientes';render()"><small>Clientes</small><b>${DB.clientes.length}</b></button>
  <button class="card tile" onclick="tab='gestao';render()"><small><span class="dot" style="background:var(--ok)"></span>Concluídos</small><b>${DB.pedidos.filter(o=>o.status=="Concluído").length}</b></button></div>
  ${agHoje()}${aniv()}<h3>Últimos orçamentos</h3>${lista([...DB.pedidos].reverse().slice(0,3))}<div class="grid" style="margin-top:6px"><button class="card tile" onclick="planos()"><span style="font-size:26px">⭐</span><b style="font-size:16px;margin-top:6px">Ver planos e preços</b></button><button class="card tile" onclick="convite()"><span style="font-size:26px">🎁</span><b style="font-size:16px;margin-top:6px">Convidar amigos</b></button></div>`},
pedidos(){
  let ps=[...DB.pedidos].reverse().filter(o=>(filtro=="Todos"||o.status==filtro)&&o.cliente.toLowerCase().includes(busca.toLowerCase()));
  return `<input placeholder="Buscar por cliente" value="${esc(busca)}" oninput="busca=this.value;lst()">
  <div class="chips">${["Todos",...ST].map(s=>{const c=COR[s],on=filtro==s;return `<button class="chip ${on&&!c?"on":""}" style="${c?(on?"background:"+c+";border-color:"+c+";color:#fff":"border-color:"+c):""}" onclick="filtro='${s}';render()">${c&&!on?`<span class="dot" style="background:${c}"></span>`:""}${s}</button>`}).join("")}</div><div id="lst">${lista(ps)}</div>`},
clientes(){const tags=[...new Set(DB.clientes.flatMap(etqs))];return `<button class="btn ghost" style="margin-bottom:10px" onclick="novoCli()">+ Novo cliente</button><input placeholder="Buscar cliente" value="${esc(bcli)}" oninput="bcli=this.value;lcli()">${tags.length?`<div class="chips">${["Todos",...tags].map(t=>`<button class="chip ${ftag==t?"on":""}" onclick="ftag='${t}';render()">${esc(t)}</button>`).join("")}</div>`:""}<div id="lcli">${cliLista(filtraCli())}</div>`},
catalogo(){return `<button class="btn ghost" style="margin-bottom:10px" onclick="cat()">+ Novo serviço ou produto</button>`+(DB.catalogo.length?[...DB.catalogo].sort((a,b)=>a.nome.localeCompare(b.nome)).map(c=>`<div class="card"><div class="row"><div><b>${esc(c.nome)}</b><br><small>${c.tipo}</small></div><b>${brl(c.preco)}</b></div><div class="row" style="justify-content:flex-end"><button class="chip" onclick="cat(${c.id})">Editar</button><button class="chip danger" onclick="delCat(${c.id})">Excluir</button></div></div>`).join(""):`<div class="empty">Cadastre seus serviços e produtos com preço.<br>Ao criar um orçamento, é só escolher da lista e o preço entra sozinho.</div>`)},
agenda(){const h=hoje(),E=[...DB.agenda].sort((a,b)=>(a.data+(a.hora||"")).localeCompare(b.data+(b.hora||"")));
  const F={"Próximos":e=>!e.feito&&e.data>=h,"Hoje":e=>!e.feito&&e.data==h,"Atrasados":e=>!e.feito&&e.data<h,"Concluídos":e=>e.feito};
  let ult="";const rows=E.filter(F[fag]||F["Próximos"]).map(e=>{const c=e.data!=ult?(ult=e.data,`<p class="mu" style="margin:14px 0 6px;font-weight:700">${rot(e.data)}</p>`):"";return c+evCard(e)}).join("");
  const at=E.filter(F["Atrasados"]).length;
  return `<button class="btn ghost" style="margin-bottom:10px" onclick="novoEv()">+ Novo compromisso</button><div class="chips">${Object.keys(F).map(k=>`<button class="chip ${fag==k&&!CAG[k]?"on":""}" style="${CAG[k]?(fag==k?"background:"+CAG[k]+";border-color:"+CAG[k]+";color:#fff":"border-color:"+CAG[k]):""}" onclick="fag='${k}';render()">${CAG[k]&&fag!=k?`<span class="dot" style="background:${CAG[k]}"></span>`:""}${k}${k=="Atrasados"&&at?" ("+at+")":""}</button>`).join("")}</div>${rows||`<div class="empty">Nada por aqui.<br>Toque em “+ Novo compromisso” para marcar um serviço.</div>`}`},
gestao(){
  const s=x=>DB.pedidos.filter(o=>x.includes(o.status)).reduce((a,o)=>a+tot(o),0);
  const r=[["Recebido",DB.pedidos.reduce((a,o)=>a+pago(o),0),"var(--ok)"],["A receber",DB.pedidos.filter(o=>["Aprovado","Em andamento","Concluído"].includes(o.status)).reduce((a,o)=>a+falta(o),0),"var(--bl)"],["Em negociação",s(["Pendente"]),"var(--wa)"]];
  const mx=Math.max(1,...r.map(x=>x[1]));
  return `<div class="card big"><small>Previsão total</small><b>${brl(r[0][1]+r[1][1])}</b><small>recebido + a receber</small></div>
  <div class="card bars">${r.map(x=>`<div><div class="row"><span>${x[0]}</span><b>${brl(x[1])}</b></div><div class="bar"><i style="width:${x[1]/mx*100}%;background:${x[2]}"></i></div></div>`).join("")}</div>
  <div class="card"><small>Em negociação ainda não entra na previsão: só conta depois que o cliente aprovar.</small></div>`}
};
function lst(){let ps=[...DB.pedidos].reverse().filter(o=>(filtro=="Todos"||o.status==filtro)&&o.cliente.toLowerCase().includes(busca.toLowerCase()));document.getElementById("lst").innerHTML=lista(ps)}
function sheet(h){document.getElementById("sh").innerHTML=`<div class="sheet" onclick="if(event.target==this)fecha()"><div>${h}</div></div>`}
function fecha(){document.getElementById("sh").innerHTML=""}
const etqs=c=>(c.etq||"").split(",").map(t=>t.replace(/['"<>\\]/g,"").trim()).filter(Boolean);
function filtraCli(){return DB.clientes.map((c,i)=>({c,i})).filter(x=>(ftag=="Todos"||etqs(x.c).includes(ftag))&&x.c.nome.toLowerCase().includes(bcli.toLowerCase()))}
function cliLista(L){return L.length?L.map(({c,i})=>{const n=DB.pedidos.filter(o=>o.cliente==c.nome).length;return `<div class="card row"><div style="flex:1;cursor:pointer" onclick="cli(${i})"><b>${esc(c.nome)}</b>${etqs(c).map(t=>` <span class="chip" style="padding:2px 8px;font-size:12px">${esc(t)}</span>`).join("")}<br><small>${esc(c.tel||"Sem telefone")} · ${n} orçamento(s)</small></div><div style="display:flex;flex-direction:column;gap:6px"><button class="chip" onclick="novoCli(${i})">Editar</button><button class="chip danger" onclick="delCli(${i})">Excluir</button></div></div>`}).join(""):`<div class="empty">Nenhum cliente por aqui.<br>Toque em “+ Novo cliente” para cadastrar.</div>`}
function lcli(){const e=document.getElementById("lcli");if(e)e.innerHTML=cliLista(filtraCli())}
function aniv(){const h=new Date(),h0=new Date(h.getFullYear(),h.getMonth(),h.getDate()),L=[];DB.clientes.forEach(c=>{if(!c.ani)return;const [y,m,dd]=c.ani.split("-").map(Number);let n=new Date(h.getFullYear(),m-1,dd);if(n<h0)n=new Date(h.getFullYear()+1,m-1,dd);const dias=Math.round((n-h0)/864e5);if(dias<=7)L.push({c,dias,dd,m})});L.sort((a,b)=>a.dias-b.dias);if(!L.length)return"";return `<div class="card"><b>🎂 Aniversários</b>${L.map(x=>`<div class="row"><span>${esc(x.c.nome)}</span><small>${x.dias==0?"hoje":x.dias==1?"amanhã":"em "+x.dias+" dias"} · ${String(x.dd).padStart(2,"0")}/${String(x.m).padStart(2,"0")}</small></div>`).join("")}</div>`}
function novoCli(i){const c=i>=0?DB.clientes[i]:null,v=k=>c?esc(c[k]||""):"",abre=c&&["mail","doc","end","ani","etq","obs"].some(k=>c[k]);sheet(`<h3>${c?"Editar cliente":"Novo cliente"}</h3><label>Nome</label><input id="cn" value="${c?esc(c.nome):""}"><label>Telefone / WhatsApp</label><input id="ct" type="tel" value="${v("tel")}"><button class="chip" style="margin:4px 0 10px" onclick="const x=document.getElementById('cx');x.style.display=x.style.display=='none'?'block':'none'">＋ Mais dados (e-mail, CPF/CNPJ, endereço, aniversário…)</button><div id="cx" style="display:${abre?"block":"none"}"><label>E-mail</label><input id="cm" type="email" value="${v("mail")}"><label>CPF ou CNPJ</label><input id="cd" value="${v("doc")}"><label>Endereço</label><input id="ce" value="${v("end")}"><label>Aniversário</label><input id="cv" type="date" value="${v("ani")}"><label>Etiquetas (separe por vírgula)</label><input id="cq" placeholder="VIP, Indicação" value="${v("etq")}"><label>Observações</label><input id="co" value="${v("obs")}"></div><button class="btn" onclick="salvaCli(${c?i:-1})">Salvar cliente</button>`)}
function salvaCli(i){const n=cn.value.trim();if(!n){cn.focus();return}const x={nome:n,tel:ct.value.trim(),mail:cm.value.trim(),doc:cd.value.trim(),end:ce.value.trim(),ani:cv.value,etq:cq.value.trim(),obs:co.value.trim()};if(i>=0){const c=DB.clientes[i],velho=c.nome;Object.assign(c,x);if(velho!==n)DB.pedidos.forEach(o=>{if(o.cliente==velho)o.cliente=n})}else DB.clientes.push({id:DB.seq++,...x});save();fecha();render();flush()}
function novoPara(i){window._cli=DB.clientes[i].nome;novo();window._cli=""}

async function pdf(id){
  const o=DB.pedidos.find(x=>x.id==id);if(!o)return;
  if(!EMP.nome){emp(true);return}
  if(!(await carregaPDF())){alert("Não foi possível carregar o gerador de PDF. Verifique a internet e tente de novo.");return}
  const D=new jspdf.jsPDF({unit:"mm",format:"a4"}),W=210,M=15,f=n=>brl(n).replace(/\u00a0/g," ");
  const Y=[247,185,0],K=[36,29,5],G=[110,100,70];
  D.setFillColor(...Y);D.rect(0,0,W,7,"F");
  let x=M,y=16,ly;
  if(EMP.logo){const s=Math.min(30/EMP.logo.w,30/EMP.logo.h),w=EMP.logo.w*s,h=EMP.logo.h*s;try{D.addImage(EMP.logo.u,EMP.logo.u.startsWith("data:image/jpeg")?"JPEG":"PNG",M,y,w,h)}catch(e){}x=M+w+6}
  D.setFont("helvetica","bold");D.setFontSize(17);D.setTextColor(...K);
  const nl=D.splitTextToSize(EMP.nome,W-M-x);D.text(nl,x,y+6);
  D.setFont("helvetica","normal");D.setFontSize(9);D.setTextColor(...G);
  ly=y+6+(nl.length-1)*7+6;
  [EMP.doc,EMP.end,[EMP.tel,EMP.email].filter(Boolean).join("   |   ")].filter(Boolean).forEach(t=>{const l=D.splitTextToSize(t,W-M-x);D.text(l,x,ly);ly+=4.5*l.length});
  y=Math.max(ly,y+32)+4;
  D.setFillColor(...Y);D.rect(M,y,W-2*M,9,"F");D.setTextColor(...K);D.setFont("helvetica","bold");D.setFontSize(12);
  D.text("Orçamento "+num(o),M+3,y+6.2);D.text(dt(o.data),W-M-3,y+6.2,{align:"right"});y+=17;
  const c=DB.clientes.find(z=>z.nome==o.cliente);
  D.setFontSize(9);D.setFont("helvetica","normal");D.setTextColor(...G);D.text("Cliente",M,y);
  D.setFontSize(12);D.setFont("helvetica","bold");D.setTextColor(...K);D.text(o.cliente,M,y+6);
  if(c&&c.tel){D.setFontSize(9);D.setFont("helvetica","normal");D.setTextColor(...G);D.text(c.tel,M,y+11)}
  y+=19;
  D.setFillColor(253,243,200);D.rect(M,y,W-2*M,8,"F");D.setFont("helvetica","bold");D.setFontSize(9);D.setTextColor(...K);
  D.text("Descrição",M+2,y+5.3);D.text("Qtd",132,y+5.3,{align:"right"});D.text("Valor unit.",163,y+5.3,{align:"right"});D.text("Total",W-M-2,y+5.3,{align:"right"});y+=8;
  D.setFont("helvetica","normal");D.setFontSize(10);
  o.itens.forEach(i=>{const l=D.splitTextToSize(i.d,95),h=l.length*4.8+4;
    if(y+h>262){D.addPage();y=20}
    D.setTextColor(...K);D.text(l,M+2,y+5);D.text(String(i.q),132,y+5,{align:"right"});D.text(f(i.p),163,y+5,{align:"right"});D.text(f(i.p*i.q),W-M-2,y+5,{align:"right"});
    y+=h;D.setDrawColor(236,228,196);D.line(M,y,W-M,y)});
  y+=6;if(y>245){D.addPage();y=20}
  const sub=o.itens.reduce((s,i)=>s+i.p*i.q,0);
  D.setFontSize(10);D.setTextColor(...G);D.text("Subtotal",140,y);D.setTextColor(...K);D.text(f(sub),W-M-2,y,{align:"right"});y+=6;
  if(o.desc){D.setTextColor(...G);D.text("Desconto ("+o.desc+"%)",140,y);D.setTextColor(...K);D.text("- "+f(sub-tot(o)),W-M-2,y,{align:"right"});y+=6}
  D.setFillColor(...Y);D.rect(125,y,W-M-125,10,"F");D.setFont("helvetica","bold");D.setFontSize(12);D.setTextColor(...K);D.text("Total",128,y+6.8);D.text(f(tot(o)),W-M-3,y+6.8,{align:"right"});y+=18;
  D.setFont("helvetica","normal");D.setFontSize(9);D.setTextColor(...G);D.text("Orçamento válido por "+EMP.val+" dias a partir de "+dt(o.data)+".",M,y);
  const N=D.getNumberOfPages();
  for(let p=1;p<=N;p++){D.setPage(p);D.setFontSize(8);D.setTextColor(...G);D.text(EMP.nome+(EMP.tel?"  |  "+EMP.tel:""),M,288);D.text(p+"/"+N,W-M,288,{align:"right"})}
  await entrega(D,"Orcamento-"+num(o)+".pdf","Orçamento "+num(o)+" - "+EMP.nome);
}

function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,"0")}

function brcode(chave,nome,cidade,valor){const sem=t=>t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9 ]/g,"").toUpperCase();let p=tlv("00","01")+tlv("26",tlv("00","br.gov.bcb.pix")+tlv("01",chave))+tlv("52","0000")+tlv("53","986")+(valor>0?tlv("54",valor.toFixed(2)):"")+tlv("58","BR")+tlv("59",sem(nome).slice(0,25)||"RECEBEDOR")+tlv("60",sem(cidade).slice(0,15)||"BRASIL")+tlv("62",tlv("05","***"))+"6304";return p+crc16(p)}

function ext(n){n=Math.round(n*100);const r=Math.floor(n/100),c=n%100,U=["","um","dois","três","quatro","cinco","seis","sete","oito","nove","dez","onze","doze","treze","catorze","quinze","dezesseis","dezessete","dezoito","dezenove"],T=["","","vinte","trinta","quarenta","cinquenta","sessenta","setenta","oitenta","noventa"],C=["","cento","duzentos","trezentos","quatrocentos","quinhentos","seiscentos","setecentos","oitocentos","novecentos"];
  const m=x=>{if(x==100)return"cem";const s=[];if(x>=100){s.push(C[Math.floor(x/100)]);x%=100}if(x>0)s.push(x<20?U[x]:T[Math.floor(x/10)]+(x%10?" e "+U[x%10]:""));return s.join(" e ")};
  const g=x=>{const mi=Math.floor(x/1e6),mil=Math.floor(x%1e6/1000),u=x%1000,p=[];if(mi)p.push(mi==1?"um milhão":m(mi)+" milhões");if(mil)p.push(mil==1?"mil":m(mil)+" mil");if(u)p.push(m(u));return p.reduce((a,b,k)=>k==0?b:a+((k==p.length-1&&(u<100||u%100==0))?" e ":" ")+b,"")};
  const a=r?g(r)+(r==1?" real":" reais"):"",b=c?g(c)+(c==1?" centavo":" centavos"):"";return a&&b?a+" e "+b:a||b||"zero"}

function temaAtual(){try{return localStorage.getItem("leao-tema")||"auto"}catch(e){return"auto"}}

function aplicaTema(){const t=temaAtual(),r=document.documentElement;if(t=="claro")r.setAttribute("data-theme","light");else if(t=="escuro")r.setAttribute("data-theme","dark");else r.removeAttribute("data-theme");const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=(t=="escuro"||(t=="auto"&&matchMedia("(prefers-color-scheme: dark)").matches))?"#14110a":"#f7b900"}
function trocaTema(){const n={auto:"claro",claro:"escuro",escuro:"auto"}[temaAtual()]||"claro";try{localStorage.setItem("leao-tema",n)}catch(e){}aplicaTema();maisMenu()}
function txt(o){return "Orçamento "+num(o)+" - Leão Orça\nCliente: "+o.cliente+"\n"+o.itens.map(i=>"• "+i.d+" ("+i.q+"x "+brl(i.p)+") = "+brl(i.p*i.q)).join("\n")+(o.desc?"\nDesconto: "+o.desc+"%":"")+"\nTotal: "+brl(tot(o))}
function waUrl(o){const c=DB.clientes.find(x=>x.nome==o.cliente);let n=((c&&c.tel)||"").replace(/\D/g,"");if(n.length==10||n.length==11)n="55"+n;return "https://wa.me/"+n+"?text="+encodeURIComponent(txt(o))}
function mailUrl(o){return "https://mail.google.com/mail/?view=cm&fs=1&su="+encodeURIComponent("Orçamento "+num(o))+"&body="+encodeURIComponent(txt(o))}
async function comp(id){const o=DB.pedidos.find(x=>x.id==id);
  const t=`Orçamento ${num(o)} - Leão Orça\nCliente: ${o.cliente}\n`+o.itens.map(i=>`• ${i.d} (${i.q}x ${brl(i.p)}) = ${brl(i.p*i.q)}`).join("\n")+(o.desc?`\nDesconto: ${o.desc}%`:"")+`\nTotal: ${brl(tot(o))}`;
  try{if(navigator.share){await navigator.share({text:t});return}}catch(e){if(e.name=="AbortError")return}
  try{await navigator.clipboard.writeText(t);alert("Texto copiado. Cole no WhatsApp ou onde quiser.")}catch(e){prompt("Copie o texto:",t)}}
render();

try{if(localStorage.getItem("leao-uid"))document.getElementById("login").style.display="none"}catch(e){}

function setCL(x){CL=x}
function getDados(){return {DB,EMP}}
function setDados(d,e){if(d)DB=d;DB.catalogo=DB.catalogo||[];DB.clientes=DB.clientes||[];DB.pedidos=DB.pedidos||[];DB.agenda=DB.agenda||[];DB.seq=DB.seq||1;migra();if(e)EMP={...EMP,...e};try{localStorage.setItem("leao-orca",JSON.stringify(DB));localStorage.setItem("leao-orca-emp",JSON.stringify(EMP))}catch(x){}render()}
function resetLocal(){DB={clientes:[],pedidos:[],seq:1,catalogo:[],agenda:[]};EMP={nome:"",doc:"",tel:"",email:"",end:"",val:7,logo:null};try{localStorage.removeItem("leao-orca");localStorage.removeItem("leao-orca-emp");localStorage.removeItem("leao-uid")}catch(x){}render()}

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,signOut,reauthenticateWithCredential,EmailAuthProvider,deleteUser} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,deleteDoc} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyCiktArK24SrEQ9PbOAxwVEibfcWUCwMlQ",authDomain:"leao-orca.firebaseapp.com",projectId:"leao-orca",storageBucket:"leao-orca.firebasestorage.app",messagingSenderId:"919909307707",appId:"1:919909307707:web:f06d755d204485a39d131e"});
const auth=getAuth(app),fs=getFirestore(app);auth.languageCode="pt-BR";
const q=id=>document.getElementById(id),msg=(t,ok)=>{const e=q("lm");e.textContent=t;e.style.color=ok?"var(--ok)":"var(--rd)"};
const show=w=>{q("lc").style.display=w=="c"?"block":"none";q("lf").style.display=w=="f"?"block":"none";q("login").style.display="flex"};
const errs={"auth/invalid-credential":"E-mail ou senha incorretos.","auth/wrong-password":"Senha incorreta.","auth/invalid-email":"E-mail inválido.","auth/email-already-in-use":"Este e-mail já tem conta. Toque em Entrar.","auth/weak-password":"A senha precisa ter ao menos 6 caracteres.","auth/missing-password":"Digite a senha.","auth/network-request-failed":"Sem conexão com a internet.","auth/too-many-requests":"Muitas tentativas. Aguarde um pouco.","auth/operation-not-allowed":"O login por e-mail e senha ainda não foi ativado no Firebase.","auth/missing-email":"Digite seu e-mail."};
const E=e=>errs[e.code]||"Erro: "+(e.code||e.message);
window.entrar=async()=>{msg("");try{await signInWithEmailAndPassword(auth,q("le").value.trim(),q("ls").value)}catch(e){msg(E(e))}};
window.criar=async()=>{msg("");if(!q("lt").checked){msg("Marque que leu e aceita os Termos e a Política de Privacidade para criar a conta.");return}
  try{const c=await createUserWithEmailAndPassword(auth,q("le").value.trim(),q("ls").value);try{await setDoc(doc(fs,"users",c.user.uid,"data","aceite"),{em:new Date().toISOString(),termos:"2026-11-06"})}catch(e){}}catch(e){msg(E(e))}};
window.esqueci=async()=>{const m=q("le").value.trim();if(!m){msg("Digite seu e-mail acima.");return}try{await sendPasswordResetEmail(auth,m);msg("Se existir uma conta com esse e-mail, enviamos o link para redefinir a senha. Olhe também a caixa de spam.",true)}catch(e){msg(E(e))}};
window.sair=async()=>{fecha();await signOut(auth);setCL(null);resetLocal()};
window.excluirConta=()=>{sheet(`<h3>Excluir minha conta</h3><p class="mu">Isso apaga <b>para sempre</b> a sua conta e todos os seus dados: clientes, orçamentos, pagamentos, agenda e dados da empresa. Não dá para desfazer. Se quiser, use antes “Exportar meus dados”.</p><label>Digite sua senha para confirmar</label><input id="xs" type="password" autocomplete="current-password"><p id="xm" style="color:var(--rd);min-height:20px;font-size:14px;margin:0 0 8px"></p><button class="btn" style="background:var(--rd);color:#fff" onclick="confirmaExcluir()">Excluir definitivamente</button><button class="btn ghost" style="margin-top:8px" onclick="conta()">Cancelar</button>`)};
window.confirmaExcluir=async()=>{const u=auth.currentUser;if(!u)return;q("xm").textContent="";
  try{await reauthenticateWithCredential(u,EmailAuthProvider.credential(u.email,q("xs").value));
    await deleteDoc(doc(fs,"users",u.uid,"data","dados"));await deleteDoc(doc(fs,"users",u.uid,"data","empresa"));try{await deleteDoc(doc(fs,"users",u.uid,"data","aceite"))}catch(e){}
    await deleteUser(u);setCL(null);resetLocal();fecha();setTimeout(()=>{show("f");msg("Sua conta e seus dados foram excluídos.")},400)}
  catch(e){q("xm").textContent=E(e)}};
const comTimeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r({code:"timeout"}),ms))]);
let sincronizando=false;
async function sincroniza(u,quieto){
  if(sincronizando)return false;sincronizando=true;
  try{
    const r1=doc(fs,"users",u.uid,"data","dados"),r2=doc(fs,"users",u.uid,"data","empresa");
    const [a,b]=await comTimeout(Promise.all([getDoc(r1),getDoc(r2)]),8000);
    const cd=a.exists()?JSON.parse(a.data().db):null,ce=b.exists()?JSON.parse(b.data().emp):null;
    let g=getDados();
    const nd=cd&&(cd.t||0)>(g.DB.t||0)?cd:null,ne=ce&&(ce.t||0)>(g.EMP.t||0)?ce:null;
    if(nd||ne)setDados(nd,ne);
    const cl={dados:{set:o=>setDoc(r1,{db:JSON.stringify(o.db)})},emp:{set:o=>setDoc(r2,{emp:JSON.stringify(o.emp)})}};
    g=getDados();
    if(!nd)await comTimeout(cl.dados.set({db:g.DB}),8000);
    if(!ne&&(g.EMP.nome||g.EMP.logo))await comTimeout(cl.emp.set({emp:g.EMP}),8000);
    setCL(cl);stat("☁️");render();return true;
  }catch(e){
    const semNet=!navigator.onLine||e.code=="unavailable"||e.code=="timeout";
    stat(semNet?"📴":"⚠️");
    if(!semNet&&!quieto)alert("Não consegui sincronizar com a nuvem ("+(e.code||e.message)+"). Seus dados continuam salvos neste aparelho.");
    return false;
  }finally{sincronizando=false}
}
onAuthStateChanged(auth,async u=>{
  if(!u){setCL(null);window.UEM=null;show("f");stat("📴");return}
  window.UEM=u.email;window.UID=u.uid;
  let local=false;try{local=localStorage.getItem("leao-uid")===u.uid}catch(e){}
  if(!local){show("c");try{resetLocal();localStorage.setItem("leao-uid",u.uid)}catch(e){}}
  const sync=navigator.onLine?sincroniza(u):(stat("📴"),Promise.resolve());
  const fim=()=>{const g=getDados();if(!g.EMP.nome&&!g.EMP.skip)boasVindas()};
  if(local){q("login").style.display="none";render();sync.then(fim)}
  else{await sync;q("login").style.display="none";render();fim()}
});
window.addEventListener("online",()=>{if(auth.currentUser)sincroniza(auth.currentUser,true)});
